services:
  - type: web
    name: sistema-brm
    env: docker
    plan: free
    region: oregon
    branch: main
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
        description: "URL do projeto Supabase para conexão do frontend React (ex: https://xyz.supabase.co)"
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
        description: "Chave anônima (anon public key) do projeto Supabase"
